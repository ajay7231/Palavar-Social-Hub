name: Deployment
on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: "18"
      - run: cd client && npm install
      - run: cd client && npm run test
      - run: cd client && npm run build
