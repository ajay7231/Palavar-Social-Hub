name: Deployment
on:
  push:
    paths:
      - "client/**"
      - ".github/**" # Change to your client directory
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 18 # Adjust the Node.js version if needed

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Install dependencies
        run: npm install
        working-directory: client # Change to your client directory

      - name: Build React app
        run: npm run build
        working-directory: client # Change to your client directory

      - name: Deploy to Netlify
        run: |
          cd client/build
          netlify deploy --auth --prod "${{ secrets.NETLIFY_AUTH_TOKEN }}" --site "${{ secrets.NETLIFY_SITE_ID }}"
